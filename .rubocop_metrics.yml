# RuboCop configuration used ONLY for collecting code metrics as refactor
# signals (see script/build_summary.rb). It is intentionally separate from any
# regular linting config: every metric cop uses Max: 0 so that RuboCop reports
# an offense for *every* method/class/module and embeds the actual metric value
# in the offense message. The build_summary script parses those values to build
# a ranking; the metrics are never used to fail a build.
AllCops:
  DisabledByDefault: true
  NewCops: disable
  SuggestExtensions: false
  TargetRubyVersion: 3.0

Metrics/AbcSize:
  Enabled: true
  Max: 0

Metrics/MethodLength:
  Enabled: true
  Max: 0
  CountComments: true

Metrics/ClassLength:
  Enabled: true
  Max: 0
  CountComments: true

Metrics/ModuleLength:
  Enabled: true
  Max: 0
  CountComments: true
