name: Refactor signals

# Measures code metrics and surfaces likely refactor hotspots as a job summary
# and a handful of PR annotations. These signals are advisory only and never
# fail the build.

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

permissions:
  contents: read

jobs:
  refactor-signals:
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v4
        with:
          # Churn is computed from the last CHURN_COMMITS commits (default 200),
          # so fetch enough history rather than the default shallow clone.
          fetch-depth: 300

      # The static analysis (Prism + RuboCop) runs on a modern Ruby, decoupled
      # from the gem's supported range (2.4–4.0). bundler-cache installs the
      # gem's dependencies so the mixin dump can actually boot MongoMapper.
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
        env:
          BUNDLE_GEMFILE: gemfiles/rails8_0.gemfile

      - name: Install analysis tools
        run: gem install rubocop --no-document

      # Max: 0 in .rubocop_metrics.yml turns every method/class into an offense
      # so the metric value is emitted; the non-zero exit is expected and ignored.
      - name: Collect RuboCop metrics
        run: rubocop --config .rubocop_metrics.yml --format json --out rubocop.json lib || true

      - name: Build dependency graph
        run: ruby script/refactor_signals.rb > deps.json

      # Boot MongoMapper and reflect on the composed classes. Non-fatal: if boot
      # fails the report is still produced, just without the mixin section.
      - name: Dump runtime mixin composition
        continue-on-error: true
        env:
          BUNDLE_GEMFILE: gemfiles/rails8_0.gemfile
        run: bundle exec ruby script/mixin_dump.rb > mixins.json

      - name: Build ranking, summary and annotations
        run: ruby script/build_summary.rb rubocop.json deps.json mixins.json
